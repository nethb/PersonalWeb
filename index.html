<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Portfolio website of a web developer student."/>
  <meta name="author" content="PERSONALWEB"/>
  <title>PERSONALWEBSITE</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <p class="welcome">Welcome to my website</p>
    <h1>Hi, I’m <span class="highlight">ABIJITH S PILLAI</span></h1>
    <h2>a web developer</h2>
    <p class="description">
      I am currently a student at Amal Jyothi College of Engineering. My social media accounts are linked below — you can know more about me by visiting and following me.
    </p>

    <div class="social-links">
      <a href="https://www.linkedin.com/in/abijith-s-pillai-6b0157200/" target="_blank" class="social">
        <img src="linkedin.png" alt="LinkedIn" />
        <span>LinkedIn</span>
      </a>
      <a href="https://www.instagram.com/abijithspillai" target="_blank" class="social">
        <img src="instagram.png" alt="Instagram" />
        <span>Instagram</span>
      </a>
    </div>
    <div>
      <a href="projects.html" class="project-button">View my projects</a>  
    <div class="feedback-section">
      <h3 class="feedback-heading">Leave Your Feedback</h3>
      <form id="feedback-form">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="feedback">Your Feedback</label>
          <textarea id="feedback" name="feedback" rows="5" placeholder="Share your thoughts..." required></textarea>
        </div>
        <button type="submit" class="feedback-button">Submit Feedback</button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
